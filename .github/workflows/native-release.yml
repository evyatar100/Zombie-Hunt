name: Native desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version for test artifacts (MAJOR.MINOR.PATCH)
        required: true
        default: 0.1.2

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: windows-x64
            runner: windows-2025
          - platform: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and verify native archive
        shell: bash
        env:
          PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          python scripts/package.py --version "$PACKAGE_VERSION"
          python scripts/verify_package.py build/dist/Zombie-Hunt-v*
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: build/dist/Zombie-Hunt-v*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Verify all downloads and create checksums
        shell: bash
        run: |
          python scripts/verify_package.py dist/Zombie-Hunt-v*
          test "$(find dist -maxdepth 1 -type f -name 'Zombie-Hunt-v*' | wc -l)" -eq 4
          (cd dist && sha256sum Zombie-Hunt-v* > SHA256SUMS.txt)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Zombie Hunt $GITHUB_REF_NAME" \
              --notes "Self-contained desktop downloads for macOS, Windows, and Linux. Java is included. macOS builds are unsigned."
          fi
